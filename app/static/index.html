<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hindsight</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M6 21l6-7 5 4 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ======================= 로그인 ======================= -->
  <main id="auth-view" class="auth" hidden>
    <section class="auth-pitch">
      <div class="logo">hindsight</div>
      <h1>예측은 봉인하고,<br>채점은 시간이 한다.</h1>
      <p>시계열을 모으고 여러 방법으로 예측을 기록해 두면, 실제값이 도착하는 대로 자동으로 채점해
        어느 방법이 정말 잘 맞았는지 공정하게 보여줍니다.</p>
    </section>
    <form id="auth-form" class="card auth-card" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="login" aria-selected="true">로그인</button>
        <button type="button" role="tab" data-tab="signup" aria-selected="false">회원가입</button>
      </div>
      <label>이메일 <input name="email" type="email" required autocomplete="username"></label>
      <label>비밀번호 <input name="password" type="password" required minlength="8" autocomplete="current-password"
        placeholder="8자 이상"></label>
      <button type="submit" id="auth-submit" class="primary">로그인</button>
      <p id="auth-msg" class="msg" role="alert"></p>
    </form>
  </main>

  <!-- ======================= 앱 ======================= -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="logo">hindsight</div>
      <select id="series-select" aria-label="시리즈 선택"></select>
      <div class="topbar-right">
        <span id="updated-at" class="muted small"></span>
        <button id="refresh-btn" class="ghost" title="새 데이터 수집 → 예측 → 채점">지금 업데이트</button>
        <details class="menu">
          <summary id="user-email"></summary>
          <div class="menu-body">
            <button id="add-series-menu" class="menu-item">시리즈 추가</button>
            <button id="demo-menu" class="menu-item">샘플 시리즈 만들기</button>
            <a class="menu-item" href="/docs" target="_blank" rel="noopener">API 문서</a>
            <button id="logout-btn" class="menu-item">로그아웃</button>
          </div>
        </details>
      </div>
    </header>

    <main class="page">
      <!-- 빈 상태 -->
      <section id="empty-view" class="empty-state" hidden>
        <h1>첫 시리즈를 만들어 보세요</h1>
        <p class="muted">샘플 데이터로 바로 결과를 보거나, 실제 도시의 기온을 모아 예측 대결을 시작할 수 있습니다.</p>
        <div class="row center">
          <button id="demo-btn" class="primary">샘플 데이터로 둘러보기</button>
          <button id="add-series-btn" class="ghost">실제 날씨 시리즈 추가</button>
        </div>
        <p id="demo-msg" class="msg"></p>
      </section>

      <!-- 대시보드 -->
      <div id="dash-view" hidden>
        <div class="page-head">
          <div>
            <h1 id="s-title"></h1>
            <div id="s-meta" class="muted small"></div>
          </div>
          <div class="row">
            <button id="add-model-btn" class="primary">모델 추가</button>
          </div>
        </div>

        <section class="kpis" id="kpis"></section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>실제값과 예측 추이</h2>
              <p class="muted small" id="main-caption"></p>
            </div>
            <div class="row wrap">
              <div class="seg" id="range-seg" role="group" aria-label="기간">
                <button data-days="3">3일</button>
                <button data-days="7" aria-pressed="true">7일</button>
                <button data-days="30">30일</button>
                <button data-days="all">전체</button>
              </div>
              <label class="inline">예측 거리 <select id="step-select"></select></label>
            </div>
          </div>
          <div class="legend" id="legend"></div>
          <div class="chart" id="main-chart"></div>
        </section>

        <div class="grid2">
          <section class="card">
            <h2>오차 추이</h2>
            <p class="muted small" id="trend-caption"></p>
            <div class="legend" id="trend-legend"></div>
            <div class="chart small-chart" id="trend-chart"></div>
          </section>
          <section class="card">
            <h2>예측 거리별 오차</h2>
            <p class="muted small">멀리 볼수록 얼마나 틀리는가 (전체 기간 평균 절대오차)</p>
            <div class="legend" id="step-legend"></div>
            <div class="chart small-chart" id="step-chart"></div>
          </section>
        </div>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>모델 순위</h2>
              <p class="muted small" id="rank-caption"></p>
            </div>
            <label class="inline small"><input type="checkbox" id="common-only" checked> 공통 시점만 비교</label>
          </div>
          <div class="table-wrap"><table class="table" id="rank-table"></table></div>
        </section>

        <p class="footer-actions"><button id="delete-series-btn" class="link danger">이 시리즈 삭제</button></p>
      </div>
    </main>
  </div>

  <!-- ======================= 모달 ======================= -->
  <dialog id="series-dialog">
    <form id="series-form" method="dialog" class="stack">
      <h2>시리즈 추가</h2>
      <label>이름 <input name="series_name" required maxlength="100" placeholder="예: 서울 기온"></label>
      <label>데이터 소스
        <select name="source">
          <option value="open_meteo">실제 날씨 (Open-Meteo, 최근 92일)</option>
          <option value="synthetic">샘플 데이터 (가짜 주기 패턴)</option>
        </select>
      </label>
      <div data-for="open_meteo" class="stack">
        <label>도시
          <select name="city">
            <option value="37.57,126.98">서울</option>
            <option value="35.18,129.08">부산</option>
            <option value="33.50,126.53">제주</option>
            <option value="35.68,139.69">도쿄</option>
            <option value="40.71,-74.01">뉴욕</option>
            <option value="51.51,-0.13">런던</option>
          </select>
        </label>
      </div>
      <label>주기
        <select name="frequency"><option value="hourly">1시간마다</option><option value="daily">하루마다</option></select>
      </label>
      <p class="msg" id="series-msg"></p>
      <div class="row end">
        <button type="button" class="ghost" data-close>취소</button>
        <button type="submit" class="primary">만들고 데이터 가져오기</button>
      </div>
    </form>
  </dialog>

  <dialog id="model-dialog">
    <form id="model-form" method="dialog" class="stack">
      <h2>모델 추가</h2>
      <label>예측 방법 <select name="model_method" id="method-select"></select></label>
      <p class="muted small" id="method-desc"></p>
      <label>이름 <input name="model_name" required maxlength="100"></label>
      <fieldset>
        <legend>학습에 쓸 기간</legend>
        <label class="inline"><input type="radio" name="cutoff" value="0.5"> 앞쪽 50% (나머지로 과거 성적을 매김)</label>
        <label class="inline"><input type="radio" name="cutoff" value="0.7" checked> 앞쪽 70%</label>
        <label class="inline"><input type="radio" name="cutoff" value="1"> 지금까지 전부 (앞으로의 예측만 채점)</label>
      </fieldset>
      <p class="msg" id="model-msg"></p>
      <div class="row end">
        <button type="button" class="ghost" data-close>취소</button>
        <button type="submit" class="primary">학습 시작</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
